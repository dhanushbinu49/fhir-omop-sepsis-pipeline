version: 2

models:
  - name: ed_sepsis_timing
    description: One row per ED visit (222 in the MIMIC demo). Minutes from ED arrival to the first blood culture and the first antibiotic, within 24 hours and before the person's next ED visit. suspected_infection means both happened.
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "minutes_to_culture between 0 and 1440"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "minutes_to_antibiotic between 0 and 1440"
    columns:
      - name: visit_occurrence_id
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('visit_occurrence')
                field: visit_occurrence_id
      - name: person_id
        data_tests:
          - not_null
      - name: arrival_datetime
        data_tests:
          - not_null
