version: 2

models:
  - name: stg_patient
    description: One row per patient (100 in the MIMIC demo).
    columns:
      - name: patient_id
        data_tests:
          - unique
          - not_null
      - name: subject_id
        data_tests:
          - unique
          - not_null
      - name: gender
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['female', 'male']
      - name: birth_date
        data_tests:
          - not_null
      - name: race_code
        data_tests:
          - not_null
