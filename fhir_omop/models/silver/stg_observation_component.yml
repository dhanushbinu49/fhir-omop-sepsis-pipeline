version: 2

models:
  - name: stg_observation_component
    description: One row per blood pressure part (an item of Observation.component, ED vitals). Key is observation_id + position.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [observation_id, position]
    columns:
      - name: observation_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_observation')
                field: observation_id
      - name: code
        data_tests:
          - not_null
