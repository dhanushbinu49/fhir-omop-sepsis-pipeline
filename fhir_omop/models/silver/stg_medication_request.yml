version: 2

models:
  - name: stg_medication_request
    description: One row per medication order. 17,552 in the MIMIC demo.
    columns:
      - name: medication_request_id
        data_tests:
          - unique
          - not_null
      - name: patient_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_patient')
                field: patient_id
      - name: encounter_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_encounter')
                field: encounter_id
      - name: medication_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_medication')
                field: medication_id
