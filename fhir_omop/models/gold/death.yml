version: 2

models:
  - name: death
    description: OMOP CDM v5.4 DEATH. One row per patient who died (31 in the MIMIC demo).
    columns:
      - name: person_id
        data_tests:
          - unique                  # a person can only die once
          - not_null
          - relationships:
              arguments:
                to: ref('person')
                field: person_id
      - name: death_date
        data_tests:
          - not_null
      - name: death_type_concept_id
        data_tests:
          - not_null
